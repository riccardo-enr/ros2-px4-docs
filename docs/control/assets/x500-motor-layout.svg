<svg xmlns="http://www.w3.org/2000/svg" width="920" height="720" viewBox="0 0 920 720" role="img" aria-labelledby="title desc">
  <title id="title">x500 X-frame motor layout and spin directions</title>
  <desc id="desc">Top-view X-frame quadrotor layout in NED: x points North, FR motor 0 and RL motor 1 spin counterclockwise, FL motor 2 and RR motor 3 spin clockwise.</desc>
  <defs>
    <marker id="arrow-dark" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#1f2937"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .grid { stroke: #e5e7eb; stroke-width: 1; }
      .arm { stroke: #374151; stroke-width: 18; stroke-linecap: round; }
      .arm-core { stroke: #f8fafc; stroke-width: 5; stroke-linecap: round; opacity: 0.75; }
      .body { fill: #111827; stroke: #030712; stroke-width: 4; }
      .rotor { fill: #ffffff; stroke: #1f2937; stroke-width: 5; }
      .hub { fill: #111827; }
      .label { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 30px; font-weight: 700; fill: #111827; text-anchor: middle; }
      .sub { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 22px; font-weight: 650; text-anchor: middle; }
      .axis { stroke: #1f2937; stroke-width: 5; marker-end: url(#arrow-dark); stroke-linecap: round; }
      .axis-label { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 26px; font-weight: 750; fill: #1f2937; }
      .ccw { stroke: #2563eb; fill: none; stroke-width: 7; stroke-linecap: round; marker-end: url(#arrow-blue); }
      .cw { stroke: #b45309; fill: none; stroke-width: 7; stroke-linecap: round; marker-end: url(#arrow-amber); }
      .ccw-text { fill: #1d4ed8; }
      .cw-text { fill: #92400e; }
      .note { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 20px; font-weight: 600; fill: #475569; text-anchor: middle; }
    </style>
  </defs>

  <rect class="bg" width="920" height="720" rx="24"/>
  <g opacity="0.9">
    <path class="grid" d="M120 120 H800 M120 240 H800 M120 360 H800 M120 480 H800 M120 600 H800"/>
    <path class="grid" d="M160 80 V640 M310 80 V640 M460 80 V640 M610 80 V640 M760 80 V640"/>
  </g>

  <g transform="translate(86 118)">
    <path class="axis" d="M0 120 V10"/>
    <text class="axis-label" x="-18" y="0">x</text>
    <text class="axis-label" x="20" y="0">North</text>
  </g>

  <g filter="url(#soft-shadow)">
    <path class="arm" d="M460 360 L250 170"/>
    <path class="arm" d="M460 360 L670 170"/>
    <path class="arm" d="M460 360 L250 550"/>
    <path class="arm" d="M460 360 L670 550"/>
    <path class="arm-core" d="M460 360 L250 170"/>
    <path class="arm-core" d="M460 360 L670 170"/>
    <path class="arm-core" d="M460 360 L250 550"/>
    <path class="arm-core" d="M460 360 L670 550"/>
    <circle class="body" cx="460" cy="360" r="46"/>
    <path d="M432 360 H488 M460 332 V388" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
  </g>

  <g>
    <circle class="rotor" cx="670" cy="170" r="70"/>
    <circle class="hub" cx="670" cy="170" r="11"/>
    <path class="ccw" d="M707 122 A56 56 0 1 0 720 198"/>
    <text class="label" x="670" y="88">FR(0)</text>
    <text class="sub ccw-text" x="670" y="264">CCW</text>

    <circle class="rotor" cx="250" cy="550" r="70"/>
    <circle class="hub" cx="250" cy="550" r="11"/>
    <path class="ccw" d="M287 502 A56 56 0 1 0 300 578"/>
    <text class="label" x="250" y="656">RL(1)</text>
    <text class="sub ccw-text" x="250" y="468">CCW</text>

    <circle class="rotor" cx="250" cy="170" r="70"/>
    <circle class="hub" cx="250" cy="170" r="11"/>
    <path class="cw" d="M213 122 A56 56 0 1 1 200 198"/>
    <text class="label" x="250" y="88">FL(2)</text>
    <text class="sub cw-text" x="250" y="264">CW</text>

    <circle class="rotor" cx="670" cy="550" r="70"/>
    <circle class="hub" cx="670" cy="550" r="11"/>
    <path class="cw" d="M633 502 A56 56 0 1 1 620 578"/>
    <text class="label" x="670" y="656">RR(3)</text>
    <text class="sub cw-text" x="670" y="468">CW</text>
  </g>

  <text class="note" x="460" y="44">Top view, X-frame quadrotor, NED convention</text>
</svg>
